[package]
name = "sitrep"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reads your system logs and tells you what's wrong, in English."
license = "MIT"
readme = "README.md"
keywords = ["logs", "journalctl", "dmesg", "systemd", "diagnostics"]
categories = ["command-line-utilities"]

[features]
default = []
# Optional: send only the lines the rule engine could not explain to Claude
# for a narrative summary. Off by default; the tool is fully offline without it.
ai = []

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
jiff = "0.2.35"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
terminal_size = "0.4.4"
toml = "1.1.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
serde_json = "1.0.151"
toml = "1.1.5"
