[package]
name = "sitrep"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reads your system logs and tells you what's wrong, in English."
license = "MIT"
readme = "README.md"
keywords = ["logs", "journalctl", "dmesg", "systemd", "diagnostics"]
categories = ["command-line-utilities"]

# The package name stays lowercase — Debian requires it and crates.io prefers
# it — while the command users actually type is capitalised.
[[bin]]
name = "SitRep"
path = "src/main.rs"


[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
jiff = "0.2.35"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
terminal_size = "0.4.4"
toml = "1.1.5"

# `cargo deb` builds the Debian package. The binary is installed under the
# Linux alias; a symlink gives `sitrep` as well so docs and scripts still work.
# NOTE: set a real maintainer before publishing a package anywhere.
[package.metadata.deb]
name = "sitrep"
maintainer = "Jacob <you@example.com>"
copyright = "2026, sitrep contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
Reads the logs your machine already keeps - journalctl, systemctl and dmesg - \
and prints a ranked report of what is actually wrong, written for a human. \
Runs entirely offline: no network, no account, no telemetry."""
section = "admin"
priority = "optional"
# Statically linked against musl, so it needs nothing at runtime.
depends = ""
assets = [
    ["target/release/SitRep", "usr/bin/SitRep", "755"],
    ["README.md", "usr/share/doc/sitrep/README.md", "644"],
]
maintainer-scripts = "packaging/debian"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
serde_json = "1.0.151"
toml = "1.1.5"
