name: release

# Tag a version to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (artifacts only, no release published)"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            cross: false
          # GitHub's free arm64 Linux runners are public-repo only, so arm64 is
          # cross-compiled in Docker instead. Swap this to a `ubuntu-24.04-arm`
          # runner with cross:false if the repo ever goes public — it is faster.
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            cross: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # musl gives one statically linked binary that runs on any distribution,
      # old glibc included, with nothing to install alongside it.
      - name: Install musl toolchain
        if: '!matrix.cross'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      # `file` works on a foreign architecture; `ldd` does not, so the static
      # check has to read the ELF header rather than try to load the binary.
      - name: Confirm the binary is genuinely static
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/SitRep
          file "$bin"
          file "$bin" | grep -q "statically linked" || {
            echo "::error::binary is not statically linked; it will not be portable"
            exit 1
          }

      # Ships as LinuxSitRep, with sitrep alongside it as a symlink that tar
      # preserves, so either name works straight out of the archive.
      - name: Stage the tarball
        run: |
          set -euo pipefail
          stage=SitRep-linux-${{ matrix.arch }}
          mkdir -p "$stage"
          cp target/${{ matrix.target }}/release/SitRep "$stage/SitRep"
          ln -s SitRep "$stage/LinuxSitRep"
          cp README.md LICENSE "$stage/"
          tar --format=gnu -czf "$stage.tar.gz" "$stage"
          sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256"

      - name: Build .deb
        run: |
          set -euo pipefail
          cargo install cargo-deb --locked
          cargo deb --no-build --target ${{ matrix.target }} --output .
          ls -la ./*.deb

      # Only meaningful natively — an aarch64 binary will not execute here.
      - name: Verify the .deb installs and both names work
        if: '!matrix.cross'
        run: |
          set -euo pipefail
          sudo dpkg -i ./*.deb
          SitRep --version | grep -q "^SitRep"
          LinuxSitRep --version | grep -q "^LinuxSitRep"
          sudo dpkg -r sitrep
          test ! -e /usr/bin/LinuxSitRep || { echo "prerm left the alias behind"; exit 1; }

      - name: Verify the cross-built .deb unpacks correctly
        if: matrix.cross
        run: |
          set -euo pipefail
          dpkg-deb -c ./*.deb | tee /tmp/contents
          grep -q "usr/bin/SitRep" /tmp/contents
          dpkg-deb -I ./*.deb | grep -i "^ Architecture"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            SitRep-linux-${{ matrix.arch }}.tar.gz
            SitRep-linux-${{ matrix.arch }}.tar.gz.sha256
            *.deb

  macos:
    name: macos universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      # One binary for Apple silicon and Intel, so there is a single download.
      - name: Fuse into a universal binary
        run: |
          set -euo pipefail
          lipo -create -output SitRep \
            target/aarch64-apple-darwin/release/SitRep \
            target/x86_64-apple-darwin/release/SitRep
          lipo -info SitRep
          ./SitRep --version | grep -q "^SitRep"

      - name: Stage the tarball
        run: |
          set -euo pipefail
          stage=MacSitRep-universal
          mkdir -p "$stage"
          cp SitRep "$stage/SitRep"
          ln -s SitRep "$stage/MacSitRep"
          cp README.md LICENSE "$stage/"
          tar --format=gnu -czf "$stage.tar.gz" "$stage"
          shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            MacSitRep-universal.tar.gz
            MacSitRep-universal.tar.gz.sha256

  publish:
    name: publish release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Reads your system logs and tells you what's wrong, in English.
            Runs entirely offline — no network, no account, no telemetry.

            | Platform | Download | Commands |
            |---|---|---|
            | macOS (Intel + Apple silicon) | `MacSitRep-universal.tar.gz` | `SitRep`, `MacSitRep` |
            | Linux x86_64 | `SitRep-linux-x86_64.tar.gz` or the `.deb` | `SitRep`, `LinuxSitRep` |
            | Linux arm64 | `SitRep-linux-aarch64.tar.gz` or the `.deb` | `SitRep`, `LinuxSitRep` |

            Linux binaries are statically linked against musl and need nothing
            installed alongside them. Each archive carries the platform-named
            alias as a symlink, so either command works.

            Verify a download with the matching `.sha256` file.
